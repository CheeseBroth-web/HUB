<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheesebroth Hub</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* デザイン変数：濃紺と鮮やかなブルーを基調としたモダンデザイン 
        */
        :root {
            --bg-color: #0f172a;       /* 背景：深い濃紺 (Slate 900) */
            --card-bg: #1e293b;        /* カード：少し明るい濃紺 (Slate 800) */
            --text-primary: #f8fafc;   /* メインテキスト：クリーンな白 */
            --text-secondary: #94a3b8; /* サブテキスト：落ち着いたグレー */
            --accent: #3b82f6;         /* アクセント：モダンなブルー (Blue 500) */
            --border: #334155;         /* ボーダー：馴染むグレー */
            --hover-border: #60a5fa;   /* ホバー時：明るいブルー */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            /* モダンなゴシック系フォントに統一 */
            font-family: 'Inter', 'Helvetica Neue', 'Arial', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 80px;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: 0.1em;
            color: var(--text-primary);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        /* タイトルの文字の一部を青くするモダンな装飾 */
        h1 span {
            color: var(--accent);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        #project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 8px; /* 少し丸みを持たせてモダンに */
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            border-color: var(--hover-border);
            transform: translateY(-4px);
            /* 青みがかったシャドウで発光感を演出 */
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .icon-box {
            color: var(--accent);
            margin-right: 12px;
            display: flex;
            align-items: center;
            background: rgba(59, 130, 246, 0.1); /* アイコンの背景に薄い青 */
            padding: 8px;
            border-radius: 6px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .card-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            min-height: 3em;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .tag {
            background: rgba(59, 130, 246, 0.15);
            color: var(--hover-border);
            padding: 4px 10px;
            border-radius: 20px; /* ピル型のタグでモダンに */
            font-weight: 600;
        }

        .loading {
            text-align: center;
            color: var(--accent);
            padding: 40px;
            font-weight: 600;
        }

        footer {
            text-align: center;
            margin-top: 100px;
            padding-bottom: 40px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* レスポンシブ対応 */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            #project-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>CHEESEBROTH <span>HUB</span></h1>
            <p class="subtitle">PROJECT ARCHIVES & REPOSITORY</p>
        </header>

        <div id="project-grid">
            <div class="loading">Loading projects...</div>
        </div>

        <footer>
            &copy; <span id="year"></span> Cheesebroth Studio.
        </footer>
    </div>

    <script>
        const USERNAME = 'cheesebroth-web';
        
        // ハブ自身を除外するためのリスト（すべて小文字で記述）
        const EXCLUDE_REPOS = ['home', 'hub', 'cheesebroth-web.github.io'];

        async function fetchProjects() {
            const grid = document.getElementById('project-grid');
            try {
                // GitHub APIから更新順に取得
                const response = await fetch(`https://api.github.com/users/${USERNAME}/repos?sort=pushed&direction=desc`);
                const repos = await response.json();

                grid.innerHTML = ''; // ローディング表示を消去

                repos.forEach(repo => {
                    const repoNameLower = repo.name.toLowerCase();
                    
                    // GitHub Pagesが有効 かつ 除外リストに含まれていない場合のみ表示
                    if (repo.has_pages && !EXCLUDE_REPOS.includes(repoNameLower)) {
                        const card = createCard(repo);
                        grid.appendChild(card);
                    }
                });

                // アイコンの描画
                lucide.createIcons();

            } catch (error) {
                console.error('Error fetching repos:', error);
                grid.innerHTML = '<div class="loading" style="color: #ef4444;">Failed to load projects.</div>';
            }
        }

        function createCard(repo) {
            const a = document.createElement('a');
            a.className = 'card';
            a.href = `https://${USERNAME}.github.io/${repo.name}/`;
            a.target = '_blank';

            // アイコンの自動判定
            let iconName = 'folder';
            const name = repo.name.toLowerCase();
            const desc = (repo.description || '').toLowerCase();

            if (name.includes('music') || name.includes('audio') || desc.includes('音') || desc.includes('曲')) iconName = 'music';
            else if (name.includes('game') || desc.includes('ゲーム')) iconName = 'gamepad-2'; // ゲーム用のアイコンを追加
            else if (name.includes('tool') || name.includes('setting')) iconName = 'settings';
            else if (name.includes('code') || name.includes('dev')) iconName = 'code';
            else if (name.includes('note') || name.includes('memo')) iconName = 'file-text';
            else if (name.includes('vocal')) iconName = 'mic';

            // 日付フォーマット
            const lastUpdated = new Date(repo.pushed_at).toLocaleDateString('ja-JP');
            const description = repo.description || '説明が設定されていません。';
            const language = repo.language || 'Web';

            a.innerHTML = `
                <div>
                    <div class="card-header">
                        <div class="icon-box"><i data-lucide="${iconName}"></i></div>
                        <div class="card-title">${repo.name}</div>
                    </div>
                    <div class="card-description">${description}</div>
                </div>
                <div class="card-footer">
                    <span class="tag">${language}</span>
                    <span>Updated: ${lastUpdated}</span>
                </div>
            `;
            return a;
        }

        document.getElementById('year').textContent = new Date().getFullYear();
        fetchProjects();
    </script>
</body>
</html>
