<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロジェクト一覧｜フロントエンドエンジニア</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* 
           デザイン変数：モダンな濃紺と青を基調としたダークモード 
           スタジオでの目の疲れを抑えるため、コントラストを微調整しています。
        */
        :root {
            --bg-deep: #0a0e14;        /* 深い紺色の背景 */
            --bg-card: #141b26;        /* カード背景 */
            --accent-blue: #3b82f6;    /* アクセントの鮮やかな青 */
            --accent-navy: #1e293b;    /* 落ち着いた濃紺 */
            --text-main: #e2e8f0;      /* メインの文字色（少しグレーを混ぜて眩しさを抑制） */
            --text-sub: #94a3b8;       /* 補助的な文字色 */
            --border: #2d3748;         /* 境界線 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: "Inter", "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 全体コンテナ */
        .hub-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        /* ヘッダーエリア */
        header {
            text-align: left;
            margin-bottom: 60px;
            border-left: 4px solid var(--accent-blue);
            padding-left: 20px;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .description {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        /* プロジェクトグリッド */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        /* プロジェクトカードのデザイン */
        .project-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* ホバー時のモダンな青い発光エフェクト */
        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
            box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.3);
        }

        .card-top {
            margin-bottom: 16px;
        }

        .icon-wrapper {
            width: 40px;
            height: 40px;
            background-color: var(--accent-navy);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            color: var(--accent-blue);
        }

        .project-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .project-desc {
            font-size: 0.875rem;
            color: var(--text-sub);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* カード下部のステータスバー */
        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .language-tag {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-blue);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* ローディングアニメーション */
        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px 0;
            color: var(--accent-blue);
        }

        footer {
            margin-top: 100px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        /* レスポンシブ対応 */
        @media (max-width: 640px) {
            .hub-container { padding: 40px 20px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <header>
            <h1>プロジェクトアーカイブ</h1>
            <p class="description">GitHubリポジトリから公開中のサイトを自動取得しています。</p>
        </header>

        <main id="project-list" class="project-grid">
            <div class="loader">プロジェクトを同期中...</div>
        </main>

        <footer>
            &copy; <span id="year"></span> Cheesebroth Web Services
        </footer>
    </div>

    <script>
        // 設定
        const GITHUB_USER = 'cheesebroth-web';
        const IGNORE_REPOS = ['home']; // ハブ自身や表示したくないリポジトリ名を入れる

        // プロジェクトの自動取得処理
        async function fetchGitHubProjects() {
            const container = document.getElementById('project-list');
            
            try {
                // pushed_at（更新順）で取得
                const response = await fetch(`https://api.github.com/users/${GITHUB_USER}/repos?sort=pushed&direction=desc`);
                const repos = await response.json();

                container.innerHTML = ''; // ローダーを消去

                repos.forEach(repo => {
                    // 条件：GitHub Pagesが有効で、かつ除外リストに含まれていない
                    if (repo.has_pages && !IGNORE_REPOS.includes(repo.name)) {
                        const card = createProjectCard(repo);
                        container.appendChild(card);
                    }
                });

                // Lucideアイコンを実行
                lucide.createIcons();

            } catch (error) {
                console.error('データの取得に失敗しました:', error);
                container.innerHTML = '<div class="loader">読み込みに失敗しました。リロードしてください。</div>';
            }
        }

        // カードのHTML要素を生成
        function createProjectCard(repo) {
            const card = document.createElement('a');
            card.className = 'project-card';
            // 公開URLの構築
            card.href = `https://${GITHUB_USER}.github.io/${repo.name}/`;
            card.target = '_blank';

            // リポジトリ名からアイコンを自動判別
            let iconType = 'layout';
            const name = repo.name.toLowerCase();
            const desc = (repo.description || "").toLowerCase();

            if (name.includes('music') || desc.includes('音') || desc.includes('曲')) iconType = 'music';
            if (name.includes('vocal') || desc.includes('声')) iconType = 'mic';
            if (name.includes('tool') || name.includes('dev')) iconType = 'cpu';
            if (name.includes('note') || desc.includes('メモ')) iconType = 'book-open';
            if (name.includes('setting') || name.includes('config')) iconType = 'settings';

            // 日付のフォーマット
            const date = new Date(repo.pushed_at).toLocaleDateString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });

            card.innerHTML = `
                <div class="card-top">
                    <div class="icon-wrapper">
                        <i data-lucide="${iconType}"></i>
                    </div>
                    <div class="project-name">${repo.name}</div>
                    <div class="project-desc">${repo.description || "説明はありません。"}</div>
                </div>
                <div class="card-meta">
                    <span class="language-tag">${repo.language || "Web"}</span>
                    <span>Last Update: ${date}</span>
                </div>
            `;

            return card;
        }

        // 初期化
        document.getElementById('year').textContent = new Date().getFullYear();
        fetchGitHubProjects();
    </script>
</body>
</html>
